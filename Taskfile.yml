version: '3'

vars:
  # Pinned tool versions. Each tool runs via `go run <module>@<version>`; nothing is installed.
  # golangci-lint v2.15.0: latest stable on proxy.golang.org (@latest, 2026-10-16)
  GOLANGCI_LINT_MODULE: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
  # staticcheck v0.8.2 (go-tools tag 2026.2.2): latest stable on proxy.golang.org (@latest, 2026-10-12)
  STATICCHECK_MODULE: honnef.co/go/tools/cmd/staticcheck@v0.8.2
  # govulncheck v1.9.0: latest stable on proxy.golang.org (@latest, 2026-10-11)
  GOVULNCHECK_MODULE: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  # Minimum total statement coverage, in percent.
  COVER_MIN: 90

tasks:
  gate:
    desc: Run the full local gate (build, vet, lint, vulncheck, race tests, coverage floor)
    cmds:
      - go build ./...
      - go vet ./...
      - go run {{.GOLANGCI_LINT_MODULE}} run ./...
      - go run {{.STATICCHECK_MODULE}} ./...
      - go run {{.GOVULNCHECK_MODULE}} ./...
      - go test -race -covermode=atomic -coverprofile=cover.out ./...
      - |
        if [ ! -s cover.out ]; then
          echo "coverage: cover.out was not written"
          exit 1
        fi
        if [ "$(wc -l < cover.out | tr -d ' ')" -le 1 ]; then
          echo "coverage: no statements exist (cover.out has no profile entries); passing"
          exit 0
        fi
        total=$(go tool cover -func=cover.out | awk '$1 == "total:" { sub(/%/, "", $NF); print $NF }')
        echo "coverage: total ${total}% (minimum {{.COVER_MIN}}%)"
        awk -v t="$total" -v m="{{.COVER_MIN}}" 'BEGIN { exit !(t + 0 >= m + 0) }' || { echo "coverage: ${total}% is below {{.COVER_MIN}}%"; exit 1; }
